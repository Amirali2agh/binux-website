<div id="project-modal" class="hidden fixed inset-0 z-[200] items-center justify-center p-3 sm:p-6 bg-slate-950/80 backdrop-blur-md" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <div class="relative w-full max-w-6xl max-h-[92vh] overflow-hidden rounded-3xl border border-slate-800 bg-brand-card shadow-2xl flex flex-col">
        <div class="flex items-center justify-between gap-4 px-5 sm:px-7 py-4 border-b border-slate-800 bg-brand-dark/70">
            <div class="min-w-0">
                <span id="project-modal-category" class="text-[10px] sm:text-xs text-brand-accent font-semibold"></span>
                <h2 id="project-modal-title" class="text-lg sm:text-2xl font-bold text-brand-textPrimary truncate"></h2>
            </div>
            <button type="button" onclick="closeProjectModal()" class="shrink-0 w-10 h-10 rounded-xl border border-slate-800 text-slate-400 hover:text-brand-accent hover:border-brand-accent/30 transition-all" aria-label="بستن">
                <svg class="w-5 h-5 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-[1.5fr_1fr] min-h-0 flex-1 overflow-y-auto custom-scrollbar">
            <div class="p-4 sm:p-6 bg-black/20">
                <div class="relative h-[260px] sm:h-[420px] lg:h-[500px] rounded-2xl overflow-hidden border border-slate-800 bg-brand-dark">
                    <img id="project-modal-image" src="" alt="" class="w-full h-full object-contain" />
                    <div id="project-modal-empty" class="hidden absolute inset-0 items-center justify-center text-center p-6">
                        <div>
                            <div class="mx-auto mb-3 w-12 h-12 rounded-2xl bg-brand-accent/10 text-brand-accent flex items-center justify-center">
                                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14M4 6h16v12H4z" stroke-width="1.5" stroke-linejoin="round"/></svg>
                            </div>
                            <p class="text-sm text-slate-400">برای این پروژه هنوز تصویری در پنل مدیریت ثبت نشده است.</p>
                        </div>
                    </div>
                    <button id="project-prev" type="button" class="hidden absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 border border-white/10 text-white hover:bg-black/70" aria-label="تصویر قبلی">‹</button>
                    <button id="project-next" type="button" class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 border border-white/10 text-white hover:bg-black/70" aria-label="تصویر بعدی">›</button>
                </div>
                <div id="project-modal-thumbs" class="mt-3 flex gap-2 overflow-x-auto pb-1"></div>
                <p id="project-modal-caption" class="text-xs text-slate-500 mt-3 min-h-5"></p>
            </div>
            <aside class="p-5 sm:p-7 border-t lg:border-t-0 lg:border-r border-slate-800 bg-brand-card">
                <p id="project-modal-summary" class="text-sm leading-7 text-brand-textSecondary"></p>
                <div class="mt-5">
                    <h3 class="text-xs font-bold text-brand-textPrimary mb-2">درباره پروژه</h3>
                    <p id="project-modal-description" class="text-xs leading-7 text-brand-textSecondary whitespace-pre-line"></p>
                </div>
                <div class="mt-5">
                    <h3 class="text-xs font-bold text-brand-textPrimary mb-2">فناوری‌ها</h3>
                    <div id="project-modal-tech" class="flex flex-wrap gap-2"></div>
                </div>
            </aside>
        </div>
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 px-5 sm:px-7 py-4 border-t border-slate-800 bg-brand-dark/60">
            <a href="{% url 'pages:projects' %}" class="order-2 sm:order-1 text-center text-xs font-bold text-brand-accent hover:text-white transition-colors">ادامه و مشاهده همه پروژه‌ها ←</a>
            <a id="project-modal-link" href="#" target="_blank" rel="noopener noreferrer" class="hidden order-1 sm:order-2 text-center px-5 py-2.5 rounded-xl bg-brand-accent text-brand-dark text-xs font-bold hover:shadow-lg hover:shadow-emerald-500/20 transition-all"></a>
        </div>
    </div>
</div>
