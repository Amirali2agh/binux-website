{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ seo_title }}</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dot-grid {
            background-size: 32px 32px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-[#010206] text-slate-100 font-sans min-h-screen flex flex-col justify-between relative overflow-hidden select-none">
    
    <!-- Active Dot-Grid Background Overlay -->
    <div class="absolute inset-0 dot-grid pointer-events-none z-0"></div>

    <!-- Soft Glow Orbs -->
    <div class="absolute inset-0 pointer-events-none z-0">
        <div class="absolute top-1/4 left-1/4 w-[400px] h-[400px] rounded-full bg-emerald-500/5 blur-[120px]"></div>
    </div>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center p-4 relative z-10">
        <div class="w-full max-w-lg bg-[#060913]/90 border border-slate-900 rounded-3xl p-8 sm:p-10 text-center shadow-2xl backdrop-blur-xl space-y-6">
            <div class="inline-flex items-center gap-2 px-3 py-1 bg-emerald-500/10 text-[#10B981] text-xs font-semibold rounded-full border border-emerald-500/20">
                <span>این صفحه به زودی  راه اندازی میشود  / coming soon </span>
            </div>
            
            <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-100 via-[#10B981] to-blue-500">
                {{ page_title }}
            </h1>
            
            <p class="text-slate-400 text-xs sm:text-sm leading-relaxed">
                محصولات الکترونیکی بیونکس در حال حاضر در فاز تحقیق و توسعه قرار دارند  .
            </p>

            <div class="pt-4">
                <a href="{% url 'pages:home' %}" class="inline-block bg-[#10B981] hover:bg-emerald-600 text-[#010206] font-black px-8 py-3.5 rounded-xl text-xs transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg shadow-emerald-500/15">
              بازگشت به صفحه اصلی 
                </a>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-[10px] text-slate-500 relative z-10">
        <p>© 2026 گروه بینوکس (Binux).  پیاده‌سازی شده و طراحی شده توسط بینوکس .</p>
    </footer>
</body>
</html>
